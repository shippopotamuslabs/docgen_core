[package]
name = "docgen_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
jsonschema = "0.29.0"
pulldown-cmark = "0.13.0"
docx-rs = "0.4.15"
printpdf = "0.7.0"
uniffi = { version = "0.29.0", features = ["cli"] }
lopdf = "0.35.0"
calamine = "0.26.1"
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
